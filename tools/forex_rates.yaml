identity:
  name: forex_rates
  author: fxmacrodata
  label:
    en_US: FX rates
    zh_Hans: 外汇汇率
description:
  human:
    en_US: Get daily FX spot rates for a currency pair from official central-bank reference rates. Needs an API key.
    zh_Hans: 获取货币对的每日外汇即期汇率，数据来自官方央行参考汇率。需要 API Key。
  llm: Get daily FX spot rates for one currency pair (base/quote, for example EUR and USD for EUR/USD) from official central-bank reference rates. Rows are most recent first, each with date and val. Requires an FXMacroData API key; without one this tool returns a message saying so.
extra:
  python:
    source: tools/forex_rates.py
parameters:
  - name: base
    type: string
    required: true
    form: llm
    label:
      en_US: Base currency
      zh_Hans: 基础货币
    human_description:
      en_US: Base currency code, for example EUR in EUR/USD.
      zh_Hans: 基础货币代码，例如 EUR/USD 中的 EUR。
    llm_description: Base currency code. One of AUD, BRL, CAD, CHF, CNH, CNY, DKK, EUR, GBP, HUF, ILS, JPY, KRW, MYR, NGN, NOK, NZD, PEN, SEK, THB, TWD, USD.
  - name: quote
    type: string
    required: true
    form: llm
    label:
      en_US: Quote currency
      zh_Hans: 报价货币
    human_description:
      en_US: Quote currency code, for example USD in EUR/USD.
      zh_Hans: 报价货币代码，例如 EUR/USD 中的 USD。
    llm_description: Quote currency code. One of AUD, BRL, CAD, CHF, CNH, CNY, DKK, EUR, GBP, HUF, ILS, JPY, KRW, MYR, NGN, NOK, NZD, PEN, SEK, THB, TWD, USD.
  - name: start_date
    type: string
    required: false
    form: llm
    label:
      en_US: Start date
      zh_Hans: 开始日期
    human_description:
      en_US: Optional start date, YYYY-MM-DD. Defaults to one year ago.
      zh_Hans: 可选开始日期，格式 YYYY-MM-DD，默认为一年前。
    llm_description: Optional inclusive start date in YYYY-MM-DD format. Defaults to 365 days ago.
  - name: end_date
    type: string
    required: false
    form: llm
    label:
      en_US: End date
      zh_Hans: 结束日期
    human_description:
      en_US: Optional end date, YYYY-MM-DD. Defaults to today.
      zh_Hans: 可选结束日期，格式 YYYY-MM-DD，默认为今天。
    llm_description: Optional inclusive end date in YYYY-MM-DD format. Defaults to today.
  - name: limit
    type: number
    required: false
    form: llm
    min: 1
    max: 100
    label:
      en_US: Limit
      zh_Hans: 数量上限
    human_description:
      en_US: Maximum rows to return, 1 to 100. Defaults to 20.
      zh_Hans: 返回的最大行数，1 到 100，默认 20。
    llm_description: Maximum number of daily rates to return, from 1 to 100, most recent first. Defaults to 20.
