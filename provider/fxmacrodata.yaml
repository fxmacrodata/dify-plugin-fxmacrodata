identity:
  author: fxmacrodata
  name: fxmacrodata
  label:
    en_US: FXMacroData
    zh_Hans: FXMacroData
  description:
    en_US: Macroeconomic indicators, release calendars and FX rates from official sources for 22 currencies. USD works without an API key.
    zh_Hans: 来自官方来源的 22 种货币宏观经济指标、数据发布日历和外汇汇率。美元数据无需 API Key。
  icon: icon.png
  tags:
    - finance
credentials_for_provider:
  api_key:
    type: secret-input
    required: false
    label:
      en_US: API key (optional)
      zh_Hans: API Key（可选）
    placeholder:
      en_US: Leave blank to use USD data without a key
      zh_Hans: 留空即可在无 Key 的情况下使用美元数据
    help:
      en_US: Without a key, USD indicators and the USD calendar work, with a 15-minute delay and 90 days of history. A key unlocks every currency, full history, real-time releases and FX rates.
      zh_Hans: 无 Key 时可使用美元指标和美元日历，数据延迟 15 分钟，历史数据限 90 天。使用 Key 可获取全部货币、完整历史、实时发布数据和外汇汇率。
    url: https://fxmacrodata.com/subscribe
extra:
  python:
    source: provider/fxmacrodata.py
tools:
  - tools/indicator_history.yaml
  - tools/data_catalogue.yaml
  - tools/release_calendar.yaml
  - tools/forex_rates.yaml
